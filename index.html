<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oracle of the Skies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: none;
      font-family: "Tinos", serif;
      color: #d69eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .oracle-wrapper {
      display: flex;
      gap: 40px;
      align-items: center;
      max-width: 1000px;
    }

    .oracle-image {
      width: 360px;
      filter: drop-shadow(0 0 25px rgba(214, 158, 238, 0.45));
    }

    .oracle-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 380px;
    }

    .oracle-whisper {
      font-size: 18px;
      margin-bottom: 18px;
      line-height: 1.6;
      color: #e8dfff;
      text-shadow: 0 0 6px rgba(214, 158, 238, 0.4);
    }

    .oracle-note {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 6px;
      color: #d8cfff;
      line-height: 1.5;
    }

    .widget-container {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="oracle-wrapper">

    <!-- LEFT: Transparent Hand Image -->
    <img class="oracle-image" src="https://i.imgur.com/zuLgkRB.png" alt="Oracle Hand" />

    <!-- RIGHT: Whisper + Weather + Note -->
    <div class="oracle-right">

      <div class="oracle-whisper">
        𝑾𝒉𝒆𝒏 𝒕𝒉𝒆 𝒔𝒌𝒚 𝒔𝒉𝒊𝒇𝒕𝒔, 𝒉𝒆𝒓 𝒘𝒉𝒊𝒔𝒑𝒆𝒓𝒔 𝒄𝒊𝒓𝒄𝒍𝒆 𝒖𝒔.
      </div>

      <div class="widget-container">
        <a class="weatherwidget-io"
           href="https://forecast7.com/en/25d76n80d19/miami/?unit=us"
           data-label_1="THE ORACLE"
           data-label_2="WHISPERS"
           data-font="Tinos"
           data-theme="original"
           data-icons="none"
           data-basecolor="rgba(0,0,0,0)"
           data-textcolor="#d69eee"
           data-highcolor="#ffa7d2"
           data-lowcolor="#c7deff"
           data-suncolor="#f4d799">
           THE ORACLE WHISPERS
        </a>
      </div>

      <div class="oracle-note">
        𝑻𝒐𝒅𝒂𝒚 𝒔𝒉𝒆 𝒌𝒆𝒆𝒑𝒔 𝒉𝒆𝒓 𝒘𝒉𝒊𝒔𝒑𝒆𝒓𝒔 𝒕𝒐 𝒉𝒆𝒓𝒔𝒆𝒍𝒇, 𝒃𝒖𝒕 𝒕𝒉𝒆 𝒓𝒆𝒂𝒍𝒎 𝒊𝒔 𝒔𝒕𝒊𝒍𝒍 𝒘𝒂𝒕𝒄𝒉𝒊𝒏𝒈.
      </div>

    </div>
  </div>

  <script>
  !function(d,s,id){
      var js,fjs=d.getElementsByTagName(s)[0];
      if(!d.getElementById(id)){
          js=d.createElement(s);
          js.id=id;
          js.src='https://weatherwidget.io/js/widget.min.js';
          fjs.parentNode.insertBefore(js,fjs);
      }
  }(document,'script','weatherwidget-io-js');
  </script>

</body>
</html>
