<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oracle of the Skies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: url('https://i.imgur.com/btVUuxb.png') no-repeat left center;
      background-size: cover;
      background-color: #0f1113;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-family: "Tinos", serif;
      color: #d69eee;
    }

    .oracle-panel {
      width: 40%;
      max-width: 420px;
      padding: 30px;
      padding-right: 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: rgba(15, 17, 19, 0.45);
      backdrop-filter: blur(4px);
      border-left: 1px solid rgba(214, 158, 238, 0.25);
    }

    .oracle-whisper {
      font-size: 18px;
      line-height: 1.6;
      color: #e8dfff;
      text-shadow: 0 0 6px rgba(214, 158, 238, 0.4);
    }

    .widget-container {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="oracle-panel">

    <div class="oracle-whisper">
      𝑾𝒉𝒆𝒏 𝒕𝒉𝒆 𝒔𝒌𝒚 𝒔𝒉𝒊𝒇𝒕𝒔, 𝒉𝒆𝒓 𝒘𝒉𝒊𝒔𝒑𝒆𝒓𝒔 𝒄𝒊𝒓𝒄𝒍𝒆 𝒖𝒔.
    </div>

    <div class="widget-container">
      <a class="weatherwidget-io"
         href="https://forecast7.com/en/25d76n80d19/miami/?unit=us"
         data-label_1="THE ORACLE"
         data-label_2="WHISPERS"
         data-font="Tinos"
         data-theme="original"
         data-icons="none"
         data-basecolor="rgba(15,17,19,0)"
         data-textcolor="#d69eee"
         data-highcolor="#ffa7d2"
         data-lowcolor="#c7deff"
         data-suncolor="#f4d799">
         THE ORACLE WHISPERS
      </a>
    </div>

  </div>

  <script>
  !function(d,s,id){
      var js,fjs=d.getElementsByTagName(s)[0];
      if(!d.getElementById(id)){
          js=d.createElement(s);
          js.id=id;
          js.src='https://weatherwidget.io/js/widget.min.js';
          fjs.parentNode.insertBefore(js,fjs);
      }
  }(document,'script','weatherwidget-io-js');
  </script>

</body>
</html>
